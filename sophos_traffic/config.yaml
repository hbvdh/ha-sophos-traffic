name: Sophos Traffic Collector
version: "0.1.4"
slug: sophos_traffic
description: >-
  Telt internetverkeer per Sophos app-categorie uit de firewall-syslog en
  publiceert tellers via MQTT discovery. Slaat geen ruwe logs op.
url: https://github.com/hbvdh/ha-sophos-traffic
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
services:
  - mqtt:need
ports:
  5514/udp: 5514
ports_description:
  5514/udp: Syslog van Sophos Firewall
options:
  firewall_ip: ""
  flush_interval: 30
  max_categories: 60
  log_level: info
  dst_overrides:
    - ip: 130.255.171.133
      category: Pulseway
  app_overrides:
    - app: QUIC
      category: QUIC (niet herkend)
    - app: Secure Socket Layer Protocol
      category: SSL (niet herkend)
schema:
  firewall_ip: str
  flush_interval: int(10,600)
  max_categories: int(5,200)
  log_level: list(debug|info|warning|error)
  dst_overrides:
    - ip: str
      category: str
  app_overrides:
    - app: str
      category: str
