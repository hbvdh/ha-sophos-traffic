# Trend-cards die zichzelf vullen op basis van het profiel van elk apparaat.
# Vereist: Sophos Traffic Collector 0.4.1+ en de HACS-card "auto-entities"
# (thomasloven/lovelace-auto-entities).
# Elke card apart toevoegen: Add card → Manual. Cards zijn gescheiden door ---.
# Een nieuw apparaat in de app-config verschijnt vanzelf in de juiste card.
# Het template levert één JSON-lijst op (| tojson), zodat namen met komma's
# of haakjes goed blijven.

# 1) Download per dag – profiel "internet"
type: custom:auto-entities
card:
  type: statistics-graph
  title: Download per dag – apparaten met internet
  chart_type: bar
  period: day
  days_to_show: 30
  stat_types:
    - change
grid_options:
  columns: full
filter:
  template: >-
    {% set ns = namespace(l=[]) %}
    {% for s in states.sensor
         | selectattr('entity_id', 'match', 'sensor\.sophos_traffic_apparaat_.*_download$')
         | selectattr('attributes.profiel', 'defined')
         | selectattr('attributes.profiel', 'eq', 'internet')
         | sort(attribute='attributes.naam') %}
      {% set ns.l = ns.l + [{'entity': s.entity_id, 'name': s.attributes.naam}] %}
    {% endfor %}
    {{ ns.l | tojson }}
show_empty: false
---
