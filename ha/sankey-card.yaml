# Sankey Chart Card (MindFreeze, v6.x) — internetverkeer (download)
# Vereist Sophos Traffic Collector 0.3.0+.
#
# Links: netwerken (interface waar het verkeer binnenkomt op de firewall)
# Midden: Internet (WAN-totaal via SNMP)
# Rechts: waarvoor (Sophos app-categorieën en overrides)
#
# Periode: volgt de datumkiezer (card "energy-date-selection", zie
# date-picker-card.yaml) die op HETZELFDE dashboard moet staan.
# Zonder datumkiezer: vervang energy_date_selection door
#   time_period_from: "now/d"
#
# Netwerken die (nog) niet bestaan worden overgeslagen (ignore_missing_entities).
# Netwerknamen en categorieën aanpassen aan wat er bij jou binnenkomt
# (Settings → Devices & services → MQTT → device "Sophos Traffic").
type: custom:sankey-chart
title: Internetverkeer
show_names: true
unit_prefix: auto
round: 1
height: 450
energy_date_selection: true
ignore_missing_entities: true
sections:
  - sort_by: state
  - {}
  - sort_by: state
nodes:
  # ---- links: netwerken (interface op de firewall) ----
  - id: sensor.sophos_traffic_netwerk_lag01_download
    name: Network (LAG01)
    section: 0
  - id: sensor.sophos_traffic_netwerk_lag01_90_download
    name: WiFi (LAG01.90)
    section: 0
  - id: sensor.sophos_traffic_netwerk_lag01_75_download
    name: HBVDH_AC / PV (LAG01.75)
    section: 0
  - id: sensor.sophos_traffic_netwerk_lag01_11_download
    name: Management (LAG01.11)
    section: 0
  - id: sensor.sophos_traffic_netwerk_lag01_99_download
    name: Gast (LAG01.99)
    section: 0
  - id: sensor.sophos_traffic_netwerk_lag01_80_download
    name: DMZ webserver (LAG01.80)
    section: 0
  - id: sensor.sophos_traffic_netwerk_port5_download
    name: PV-bridge Port5
    section: 0
  - id: sensor.sophos_traffic_netwerk_port6_download
    name: PV-bridge Port6
    section: 0
  - id: sensor.sophos_traffic_netwerk_port7_download
    name: PV-bridge Port7
    section: 0
  - id: sensor.sophos_traffic_netwerk_port8_download
    name: PV-bridge Port8
    section: 0
  - id: net_restpost
    type: remaining_child_state
    name: Lopende sessies / overig
    section: 0
  # ---- midden ----
  - id: sensor.sophos_traffic_wan_download
    name: Internet
    section: 1
  # ---- rechts: waarvoor ----
  - id: sensor.sophos_traffic_streaming_media_download
    name: Streaming
    section: 2
  - id: sensor.sophos_traffic_social_networking_download
    name: Social
    section: 2
  - id: sensor.sophos_traffic_general_internet_download
    name: Websites
    section: 2
  - id: sensor.sophos_traffic_software_update_download
    name: Updates
    section: 2
  - id: sensor.sophos_traffic_general_business_download
    name: Zakelijk
    section: 2
  - id: sensor.sophos_traffic_storage_and_backup_download
    name: Opslag & backup
    section: 2
  - id: sensor.sophos_traffic_generative_ai_download
    name: AI
    section: 2
  - id: sensor.sophos_traffic_pulseway_download
    name: Pulseway
    section: 2
  - id: sensor.sophos_traffic_quic_niet_herkend_download
    name: QUIC (niet herkend)
    section: 2
  - id: sensor.sophos_traffic_ssl_niet_herkend_download
    name: SSL (niet herkend)
    section: 2
  - id: sensor.sophos_traffic_infrastructure_download
    name: Infrastructuur
    section: 2
  - id: cat_restpost
    type: remaining_parent_state
    name: Lopende sessies / overig
    section: 2
links:
  # netwerken -> Internet (restpost als laatste)
