# Sophos WAN-totaal via SNMP (ifHCInOctets / ifHCOutOctets, 64-bit tellers)
# Plaats als /config/packages/sophos_traffic.yaml
#
# Aanpassen:
#   - host: IP van de XG waarop HA SNMP mag uitlezen
#   - <IFINDEX>: ifIndex van Port11 (zie README, stap 4)
#   - secrets.yaml: sophos_snmp_community: "<jouw community>"

sensor:
  - platform: snmp
    name: Sophos WAN download
    unique_id: sophos_wan_download
    host: 172.16.10.1
    version: 2c
    community: !secret sophos_snmp_community
    baseoid: 1.3.6.1.2.1.31.1.1.1.6.<IFINDEX>
    unit_of_measurement: B
    device_class: data_size
    state_class: total_increasing
    scan_interval: 60

  - platform: snmp
    name: Sophos WAN upload
    unique_id: sophos_wan_upload
    host: 172.16.10.1
    version: 2c
    community: !secret sophos_snmp_community
    baseoid: 1.3.6.1.2.1.31.1.1.1.10.<IFINDEX>
    unit_of_measurement: B
    device_class: data_size
    state_class: total_increasing
    scan_interval: 60
